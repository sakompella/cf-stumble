# `cf` refuses to run at a workspace root that is not itself a workspace package, so the root is
# listed. `build:pi` uses `--filter` and `pnpm verify` passes, but recursive `pnpm -r` commands now
# include the root.
packages:
  - "."
  - vendor/pi-v0.84.4
# esbuild and workerd ship prebuilt native binaries fetched by their postinstall.
# koffi loads Hegel's native generation engine for the Node-only property project.
allowBuilds:
  "@mongodb-js/zstd": false
  esbuild: true
  koffi: true
  node-liblzma: false
  workerd: true
# Cloudflare ships the Workers toolchain on a near-daily cadence pinned to a
# compatibility date, so the release-age gate would block every routine update.
minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin"
  - "@cloudflare/workers-types"
  - miniflare
  - wrangler
  - "@cloudflare/workerd-darwin-64@1.20261006.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261006.1"
  - "@cloudflare/workerd-linux-64@1.20261006.1"
  - "@cloudflare/workerd-linux-arm64@1.20261006.1"
  - "@cloudflare/workerd-windows-64@1.20261006.1"
  - workerd@1.20261006.1
  - "@cloudflare/build-output-utils@0.9.0"
  - "@cloudflare/codemods@0.4.2"
  - "@cloudflare/config@0.24.1"
  - "@cloudflare/runtime-types@0.1.9"
  - cf@1.0.0-beta.14
