# esbuild and workerd ship prebuilt native binaries fetched by their postinstall.
# Both are first-party (evanw / Cloudflare) and required for vitest and workerd to run.
allowBuilds:
  esbuild: true
  workerd: true
# Cloudflare ships the Workers toolchain on a near-daily cadence pinned to a
# compatibility date, so the release-age gate would block every routine update.
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-plugin'
  - '@cloudflare/workers-types'
  - miniflare
  - wrangler
