# esbuild and workerd ship prebuilt native binaries fetched by their postinstall.
# Both are first-party (evanw / Cloudflare) and required for vitest and workerd to run.
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-plugin@1.1.0'
  - '@cloudflare/workers-types@5.20260826.1'
  - miniflare@5.20260825.0-alpha
  - wrangler@4.126.0
