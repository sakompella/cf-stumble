name: Preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  image:
    needs: verify
    uses: ./.github/workflows/workspace-image.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      packages: write

  preview:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_ID: pv${{ github.run_id }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run deploy preview --yes
      - name: Find the preview Worker's workers.dev URL
        run: |
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')"
          echo "STUMBLE_URL=https://cf-stumble-preview.$subdomain.workers.dev" >> "$GITHUB_ENV"
      - name: Release the pull request's head as the preview's active generation
        run: pnpm exec tsx tools/release-generation.mts --force
        env:
          OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
      - run: pnpm e2e --stage preview --keep --run-id "$RUN_ID"
        env:
          E2E_OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
      - if: cancelled()
        run: pnpm e2e --stage preview --run-id "$RUN_ID" --cleanup
        env:
          E2E_OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
