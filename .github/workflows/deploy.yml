name: Deploy

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: The Alchemy stage; any stage other than prod is a separate Worker cf-stumble-<stage>
        type: string
        default: prod

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.stage || 'prod' }}
  cancel-in-progress: false

jobs:
  image:
    # A pull request from a fork whose branch is named main also completes a
    # Verify run with head_branch main, so deploy only after a push here.
    if: >-
      github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || inputs.stage != 'prod') ||
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/workspace-image.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: read
      packages: write

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Refuse an automatic deploy of a commit that is no longer main's tip
        if: github.event_name == 'workflow_run'
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" != "$TARGET_SHA" ]; then
            echo "refusing to deploy $TARGET_SHA: main's tip is $tip" >&2
            exit 1
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # --yes approves the plan without a terminal. It also lets Alchemy create
      # or upgrade the state store, which it refuses in CI without it.
      - run: pnpm run deploy "$STAGE" --yes
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
