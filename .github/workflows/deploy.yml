name: Deploy

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: The Alchemy stage; any stage other than prod is a separate Worker cf-stumble-<stage>
        type: string
        default: prod

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.stage || 'prod' }}
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_run ]; then
            echo current=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$TARGET_SHA" ]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipping $TARGET_SHA: main's tip is $tip, which deploys on its own run"
            echo current=false >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: fresh
    if: >-
      needs.fresh.outputs.current == 'true' && (
        github.event_name == 'workflow_dispatch' &&
          (github.ref == 'refs/heads/main' || inputs.stage != 'prod') ||
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    uses: ./.github/workflows/workspace-image.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: read
      packages: write

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy "$STAGE" --yes
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Release main as the active generation
        if: (inputs.stage || 'prod') == 'prod'
        run: pnpm exec tsx tools/release-generation.mts
        env:
          STUMBLE_URL: https://stumble.akompella.dev
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
