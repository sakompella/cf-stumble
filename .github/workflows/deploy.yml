name: Deploy

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      adopt:
        description: Adopt the Worker and container application that `cf deploy` created (the one-time switch)
        type: boolean
        default: false
      stage:
        description: The Alchemy stage; any stage other than prod is a separate Worker cf-stumble-<stage>
        type: string
        default: prod

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.stage || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    # A pull request from a fork whose branch is named main also completes a
    # Verify run with head_branch main, so deploy only after a push here.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # --yes approves the plan without a terminal. It also lets Alchemy create
      # or upgrade the state store, which it refuses in CI without it.
      - run: >-
          pnpm run install:infra && pnpm run build:page &&
          pnpm alchemy deploy --config infra/alchemy.run.ts --stage "$STAGE" --yes
          ${{ inputs.adopt && '--adopt' || '' }}
        env:
          STAGE: ${{ inputs.stage || 'prod' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
